name: Kripto Sinyal Kontrolu

on:
  schedule:
    # Her 5 dakikada bir calistir (UTC) - GitHub Actions minimum 5 dakika
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manuel calistirma

jobs:
  check-signals:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Kutuphaneleri Kur
      run: |
        pip install ccxt pandas python-telegram-bot
    
    - name: Sinyal Kontrol
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python telegram_bot_github.py
