name: Kripto Sinyal Kontrolu

on:
  schedule:
    # Her 15 dakikada bir calistir (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manuel calistirma

jobs:
  check-signals:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Kutuphaneleri Kur
      run: |
        pip install ccxt pandas python-telegram-bot
    
    # Test mesaji sadece manuel calistirmada gonderilir (cron'da spam olmasin)
    - name: Telegram Test (Bot Calisma Kontrolu)
      if: github.event_name == 'workflow_dispatch'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python test_telegram.py
    
    - name: Sinyal Kontrol
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Otomatik trade (KuCoin Futures) — sadece AUTO_TRADE_ENABLED=true ve API bilgileri dolu ise işlem açar
        KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
        KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
        KUCOIN_API_PASSPHRASE: ${{ secrets.KUCOIN_API_PASSPHRASE }}
        KUCOIN_SANDBOX: ${{ secrets.KUCOIN_SANDBOX }}
        AUTO_TRADE_ENABLED: ${{ secrets.AUTO_TRADE_ENABLED }}
        AUTO_TRADE_DRY_RUN: ${{ secrets.AUTO_TRADE_DRY_RUN }}
      run: |
        python telegram_bot_github.py

