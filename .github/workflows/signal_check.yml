name: Kripto Sinyal Kontrolu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Ayni anda tek run: yeni baslarsa onceki iptal et (araliklar duzenli kalsin)
concurrency:
  group: signal-check
  cancel-in-progress: true  # true = yeni baslarsa onceki iptal et (1.5 saat beklemesin)

jobs:
  check-signals:
    # Self-hosted runner: kendi bilgisayarinda calisir, 30 dk'da bir garantili tetiklenir (GitHub kuyrugu yok)
    runs-on: [self-hosted, windows]
    timeout-minutes: 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kutuphaneleri Kur
      run: pip install ccxt pandas python-telegram-bot

    - name: Calisma Zamani (UTC)
      run: |
        echo "Workflow basladi: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC"

    - name: Telegram Test (Bot Calisma Kontrolu)
      if: github.event_name == 'workflow_dispatch'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python test_telegram.py

    - name: Sinyal Kontrol
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
        KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
        KUCOIN_API_PASSPHRASE: ${{ secrets.KUCOIN_API_PASSPHRASE }}
        KUCOIN_SANDBOX: ${{ secrets.KUCOIN_SANDBOX }}
        AUTO_TRADE_ENABLED: ${{ secrets.AUTO_TRADE_ENABLED }}
        AUTO_TRADE_DRY_RUN: ${{ secrets.AUTO_TRADE_DRY_RUN }}
      run: python telegram_bot_github.py

